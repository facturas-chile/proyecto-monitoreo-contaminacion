name: Sync dashboard to gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  environments: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Remove custom branch restriction on github-pages environment so that
      # pushes originating from a 'main' workflow are accepted by Pages.
      - name: Open github-pages environment to all branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/github-pages" \
            -d '{"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":false}}')
          echo "Environment update HTTP status: $STATUS"

      - name: Push dashboard/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add /tmp/gh-pages gh-pages
          cp dashboard/index.html /tmp/gh-pages/index.html
          cp dashboard/config.example.js /tmp/gh-pages/config.example.js
          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy dashboard from $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
          git push origin gh-pages
