name: Sync dashboard to gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push dashboard/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Detach to avoid branch confusion
          git worktree add /tmp/gh-pages gh-pages
          # Copy dashboard files to worktree root
          cp dashboard/index.html /tmp/gh-pages/index.html
          cp dashboard/config.example.js /tmp/gh-pages/config.example.js
          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy dashboard from $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
          git push origin gh-pages
